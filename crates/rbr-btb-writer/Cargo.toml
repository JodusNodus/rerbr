[package]
name = "rbr-btb-writer"
version = "0.1.0"
edition = "2021"
description = "The BTB stage writing the game converters share: textures, meshes, driveline and pacenotes, collision checks, the stage's preparation"
license = "GPL-3.0-or-later"

[dependencies]
rbr-btb = { path = "../rbr-btb" }
rbr-formats = { path = "../rbr-formats" }
bcdec_rs = "0.2.1"
intel_tex_2 = "0.5.0"
texpresso = { version = "2.0.2", features = ["rayon"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde_json = "1"
