[package]
name = "rbr-beamng"
version = "0.1.0"
edition = "2021"
description = "BeamNG levels read in place and converted to BTB stage folders on the player's machine"
license = "GPL-3.0-or-later"

[lib]
name = "rbr_beamng"
path = "src/lib.rs"

[[bin]]
name = "beamng-stage"
path = "src/bin/beamng_stage.rs"

[dependencies]
rbr-btb = { path = "../rbr-btb" }
rbr-formats = { path = "../rbr-formats" }
ruzstd = "0.8"
texpresso = { version = "2.0.2", features = ["rayon"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
