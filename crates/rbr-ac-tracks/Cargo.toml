[package]
name = "rbr-ac-tracks"
version = "0.1.0"
edition = "2021"
description = "Assetto Corsa tracks as BTB stages: the KN5 and AI readers, and the import interface"
license = "GPL-3.0-or-later"

[lib]
name = "rbr_ac_tracks"
path = "src/lib.rs"

[[bin]]
name = "rbr-ac-tracks"
path = "src/main.rs"

[features]
# A synthetic track for tests (`fixture`), used by this crate's own tests and the launcher's.
fixture = []

[dependencies]
rbr-btb = { path = "../rbr-btb" }
rbr-btb-writer = { path = "../rbr-btb-writer" }
rbr-formats = { path = "../rbr-formats" }
serde_json = "1"
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }


[dev-dependencies]
rbr-ac-tracks = { path = ".", features = ["fixture"] }
