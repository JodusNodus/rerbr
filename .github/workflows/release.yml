# On a pushed v* tag: the macOS, Linux and Windows packages (scripts/package.sh), attached to a draft GitHub release.
# Run by hand (Actions, "Run workflow") or nightly on main: the packages as the run's artifacts only, no release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  linux:
    runs-on: ubuntu-24.04
    # Debian 12's glibc (2.36) is the AppImage's floor.
    container: rust:1-bookworm
    steps:
      - run: |
          apt-get update
          apt-get install -y cmake libasound2-dev libudev-dev libxkbcommon-x11-0
      - uses: actions/checkout@v4
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --draft --title "ReRBR $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/*
        env:
          GH_TOKEN: ${{ github.token }}
